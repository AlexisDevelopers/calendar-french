<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario 6–30 de octubre 2026</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d1d1f;--muted:#777;--accent:#d9480f;--line:#e4e0d6;--done:#f1ede4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--text:#f2f2f2;--muted:#9a9a9a;--accent:#ff8c5a;--line:#37373d;--done:#2b2b30}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--text:#f2f2f2;--muted:#9a9a9a;--accent:#ff8c5a;--line:#37373d;--done:#2b2b30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 12px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.count{font-size:.85rem;color:var(--muted);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dow{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:10px}
.day{position:relative;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .1s}
.day:active{transform:scale(.94)}
.day small{position:absolute;top:3px;left:5px;font-size:.55rem;font-weight:500;color:var(--muted)}
.day.today{outline:2px solid var(--accent)}
.day.done{background:var(--done);color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.day.done::after{content:"";position:absolute;inset:0;border-radius:10px;
background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--accent) calc(50% - 1.5px),var(--accent) calc(50% + 1.5px),transparent calc(50% + 1.5px)),
linear-gradient(to bottom right,transparent calc(50% - 1.5px),var(--accent) calc(50% - 1.5px),var(--accent) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.foot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
button.reset{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
#celebrate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 110%,rgba(46,26,100,.96),rgba(5,5,18,.97) 70%);padding:20px}
#celebrate.show{display:flex}
#fw{position:absolute;inset:0;width:100%;height:100%}
#closeCel{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:20px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
#closeCel:hover{background:rgba(255,255,255,.2)}
.msg{position:relative;z-index:2;pointer-events:none;text-align:center;max-width:640px;padding:0 12px;font-family:Georgia,"Times New Roman",serif}
.msg .ico{font-size:2.6rem;animation:pop 1s ease-out .2s both}
.msg h2{margin:6px 0 12px;font-size:clamp(2.3rem,9vw,3.8rem);line-height:1.1;font-weight:700;letter-spacing:.01em;
background:linear-gradient(90deg,#ffd76a,#fff6d2,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 18px rgba(255,200,90,.45));animation:pop 1s ease-out .35s both}
.msg p{margin:0;color:#f6efff;font-size:clamp(1.1rem,4vw,1.6rem);line-height:1.45;font-style:italic;text-shadow:0 2px 14px rgba(0,0,0,.7);animation:pop 1s ease-out .8s both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📅 Octubre 2026</h1>
  <div class="sub">Del 6 al 30 de octubre (solo días laborables) · toca un día para tacharlo</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><span id="note">Solo lectura</span><button class="reset" id="lock">🔒 Editar</button></div>
</div>
<div id="celebrate">
  <canvas id="fw"></canvas>
  <button id="closeCel" aria-label="Cerrar">×</button>
  <div class="msg">
    <div class="ico">🎓</div>
    <h2>Félicitations !</h2>
    <p>Le cours a été difficile,<br>mais tu l’as terminé !</p>
  </div>
</div>
<script>
const PK="cal-oct-2026-pass";
let done=new Set(), pass="", edit=false;
try{pass=localStorage.getItem(PK)||""}catch(e){}
const grid=document.getElementById("grid");
["L","M","X","J","V"].forEach(d=>{const e=document.createElement("div");e.className="dow";e.textContent=d;grid.appendChild(e)});
const dias=["dom","lun","mar","mié","jue","vie","sáb"];
const now=new Date();const todayD=(now.getFullYear()===2026&&now.getMonth()===9)?now.getDate():-1;
const buttons={};let total=0;
async function push(){
  const r=await fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pass,done:[...done]})});
  return r.ok;
}
async function pull(){
  try{const r=await fetch("/api/state",{cache:"no-store"});const j=await r.json();done=new Set(j.done||[]);render()}catch(e){}
}
for(let d=5;d<=30;d++){
  const wd=new Date(2026,9,d).getDay();
  if(wd===0||wd===6)continue;
  if(d<6){const e=document.createElement("div");e.className="cell";grid.appendChild(e);continue}
  const b=document.createElement("button");
  b.className="cell day"+(d===todayD?" today":"");
  b.innerHTML=d+"<small>"+dias[wd]+"</small>";
  b.setAttribute("aria-label","Octubre "+d);
  b.onclick=async()=>{
    if(!edit)return;
    const had=done.has(d);had?done.delete(d):done.add(d);render();
    let ok=false;try{ok=await push()}catch(e){}
    if(!ok){had?done.add(d):done.delete(d);render();alert("No se pudo guardar. Revisa la contraseña o la conexión.")}
    else if(!had&&d===30){celebrate()}
  };
  buttons[d]=b;grid.appendChild(b);total++;
}
function render(){
  for(const d in buttons){buttons[d].classList.toggle("done",done.has(+d));buttons[d].style.cursor=edit?"pointer":"default"}
  const n=[...done].filter(d=>buttons[d]).length;
  document.getElementById("count").textContent=n+" de "+total+" días tachados · faltan "+(total-n);
  document.getElementById("bar").style.width=(n/total*100)+"%";
  document.getElementById("lock").textContent=edit?"🔓 Salir de edición":"🔒 Editar";
  document.getElementById("note").textContent=edit?"Modo edición: tus cambios se guardan para todos":"Solo lectura";
}
async function unlock(p){
  const prev=pass;pass=p;
  let ok=false;try{ok=await push()}catch(e){}
  if(ok){edit=true;try{localStorage.setItem(PK,p)}catch(e){}}else{pass=prev;if(p)alert("Contraseña incorrecta")}
  render();return ok;
}
document.getElementById("lock").onclick=async()=>{
  if(edit){edit=false;try{localStorage.removeItem(PK)}catch(e){}pass="";render();return}
  const p=prompt("Contraseña de edición:");if(p)await unlock(p);
};

/* Fuegos artificiales al marcar el día 30 */
const cel=document.getElementById("celebrate"),cv=document.getElementById("fw"),ctx=cv.getContext("2d");
let rockets=[],parts=[],flashes=[],raf=0,timer=0,tos=[];
let actx=null,master=null,nbuf=null;
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.5;master.connect(actx.destination)}catch(e){}}
  if(actx&&actx.state==="suspended")actx.resume();
}
document.addEventListener("pointerdown",audio,{passive:true});
function noise(){
  if(!nbuf){nbuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=actx.createBufferSource();s.buffer=nbuf;return s;
}
function sndLaunch(){
  if(!actx)return;const t=actx.currentTime;
  const s=noise(),f=actx.createBiquadFilter(),g=actx.createGain();
  f.type="bandpass";f.Q.value=2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2200,t+.9);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.1);g.gain.linearRampToValueAtTime(0,t+.95);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+1);
}
function sndBoom(){
  if(!actx)return;const t=actx.currentTime;
  const o=actx.createOscillator(),og=actx.createGain();
  o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(35,t+.5);
  og.gain.setValueAtTime(.7,t);og.gain.exponentialRampToValueAtTime(.001,t+.6);
  o.connect(og);og.connect(master);o.start(t);o.stop(t+.65);
  const s=noise(),f=actx.createBiquadFilter(),g=actx.createGain();
  f.type="lowpass";f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(300,t+.5);
  g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.75);
  for(let i=0;i<7;i++){
    const tt=t+.15+Math.random()*.8,c=noise(),hf=actx.createBiquadFilter(),cg=actx.createGain();
    hf.type="highpass";hf.frequency.value=3500;
    cg.gain.setValueAtTime(.1,tt);cg.gain.exponentialRampToValueAtTime(.001,tt+.04);
    c.connect(hf);hf.connect(cg);cg.connect(master);c.start(tt,Math.random());c.stop(tt+.05);
  }
}
function resize(){cv.width=innerWidth;cv.height=innerHeight}
function add(x,y,vx,vy,h,o){
  parts.push(Object.assign({x,y,vx,vy,h,life:1,decay:.011,grav:.045,drag:.985,size:2.2,l:60},o||{}));
}
function explode(x,y){
  sndBoom();
  flashes.push({x,y,life:1});
  const kind=["sphere","sphere","ring","willow","heart","double"][Math.floor(Math.random()*6)];
  const h=Math.random()*360,h2=(h+150+Math.random()*60)%360;
  if(kind==="sphere"||kind==="double"){
    const n=110;
    for(let i=0;i<n;i++){const a=Math.PI*2*i/n,s=(.4+Math.random()*.6)*5.2;add(x,y,Math.cos(a)*s,Math.sin(a)*s,h+Math.random()*30)}
    if(kind==="double"){for(let i=0;i<60;i++){const a=Math.PI*2*i/60,s=2.2;add(x,y,Math.cos(a)*s,Math.sin(a)*s,h2,{size:2})}}
  }else if(kind==="ring"){
    const tilt=.35+Math.random()*.6;
    for(let i=0;i<90;i++){const a=Math.PI*2*i/90;add(x,y,Math.cos(a)*5,Math.sin(a)*5*tilt,h,{decay:.012})}
    for(let i=0;i<40;i++){const a=Math.random()*6.283,s=Math.random()*1.8;add(x,y,Math.cos(a)*s,Math.sin(a)*s,h2,{size:1.6})}
  }else if(kind==="willow"){
    for(let i=0;i<100;i++){const a=Math.random()*6.283,s=1+Math.random()*4;add(x,y,Math.cos(a)*s,Math.sin(a)*s,42,{decay:.0055,grav:.06,drag:.982,l:62,size:1.8})}
  }else{
    for(let i=0;i<100;i++){
      const t=Math.PI*2*i/100,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      add(x,y,hx*.3,hy*.3,345+Math.random()*20,{decay:.01,drag:.988,l:62});
    }
  }
  if(parts.length>3000)parts.splice(0,parts.length-3000);
}
function launch(){
  sndLaunch();
  const H=innerHeight,ty=H*(.14+Math.random()*.3),g=.1;
  rockets.push({x:innerWidth*(.12+Math.random()*.76),y:H+10,vx:(Math.random()-.5)*1.2,vy:-Math.sqrt(2*g*(H-ty)),g});
}
function frame(){
  ctx.globalCompositeOperation="destination-out";
  ctx.fillStyle="rgba(0,0,0,.22)";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalCompositeOperation="lighter";
  for(const r of rockets){
    r.x+=r.vx;r.y+=r.vy;r.vy+=r.g;
    add(r.x,r.y,(Math.random()-.5)*.6,Math.random()*.8,35,{decay:.05,size:1.4,grav:.02,l:70});
    ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(r.x,r.y,2.4,0,6.283);ctx.fill();
    if(r.vy>-1){r.dead=true;explode(r.x,r.y)}
  }
  rockets=rockets.filter(r=>!r.dead);
  for(const f of flashes){
    const rad=140*(1.4-f.life),gr=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,rad);
    gr.addColorStop(0,"rgba(255,255,255,"+(.55*f.life)+")");gr.addColorStop(1,"rgba(255,255,255,0)");
    ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(f.x-rad,f.y-rad,rad*2,rad*2);f.life-=.08;
  }
  flashes=flashes.filter(f=>f.life>0);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=p.drag;p.vy*=p.drag;p.life-=p.decay;
    const tw=p.life<.4&&Math.random()<.25?.25:1;
    ctx.globalAlpha=Math.max(p.life,0)*tw;
    ctx.fillStyle="hsl("+p.h+",100%,"+p.l+"%)";
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.5+.5*Math.max(p.life,0)),0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  raf=requestAnimationFrame(frame);
}
function celebrate(){
  audio();resize();cel.classList.add("show");
  rockets=[];parts=[];flashes=[];
  [0,260,520].forEach(ms=>tos.push(setTimeout(launch,ms)));
  clearInterval(timer);
  timer=setInterval(()=>{launch();if(Math.random()<.55)tos.push(setTimeout(launch,200+Math.random()*350))},900);
  cancelAnimationFrame(raf);frame();
}
function stopCel(){
  cel.classList.remove("show");clearInterval(timer);tos.forEach(clearTimeout);tos=[];
  cancelAnimationFrame(raf);rockets=[];parts=[];flashes=[];
}
document.getElementById("closeCel").onclick=stopCel;
addEventListener("resize",()=>{if(cel.classList.contains("show"))resize()});

(async()=>{await pull();if(pass){const p=pass;pass="";await unlock(p)}})();
setInterval(()=>{if(!edit)pull()},30000);
render();
</script>
</body>
</html>
